[package]
name = "kunai"
version = "0.1.0"
description = "Kunai smart code and text editor"
authors = ["Kunai"]
edition = "2021"

[lib]
name = "kunai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Enables embedded production assets (../dist) via Tauri's custom protocol.
# Keep out of `default` so `tauri dev` uses Vite HMR at http://localhost:1420.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
quick-xml = "0.37"
similar = "2"
walkdir = "2"
regex = "1"
encoding_rs = "0.8"
base64 = "0.22"
hex = "0.4"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
urlencoding = "2"
